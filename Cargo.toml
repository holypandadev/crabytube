[package]
name = "crabytube"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

build = "build.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
# The system media controls (media keys and the media panel); already in the build through other crates.
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Playback", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(windows)'.dev-dependencies]
# The test that reads the media session back from the system.
windows = { version = "0.62", features = ["Foundation_Collections", "Media_Control"] }

[features]
default = []
# Development-only diagnostics: command-line test modes (--scroll-test, --soak,
# --autoplay, --screenshots, ...) and Iced's debug timing overlay.
diagnostics = ["iced/debug"]

[workspace]
members = ["botguard-helper", "helper-guard", "js-challenge-helper"]
default-members = [".", "botguard-helper", "helper-guard", "js-challenge-helper"]
resolver = "3"

[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
rustypipe-botguard = { path = "botguard-helper/vendor/rustypipe-botguard" }

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "http2", "system-proxy"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp4"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
stream-download = { version = "0.24.4", default-features = false, features = ["temp-storage"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
json5 = "1.3"
sha2 = "0.10"
# Checks the signature of an update (Ed25519); already in the build through rustls, which also picks
# its backend.
aws-lc-rs = { version = "1", default-features = false }
dirs = "6"
jiff = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"

roxmltree = "0.20"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Both renderers are compiled in. tiny-skia (CPU, patched copy in
# vendor/iced_tiny_skia) is the default; the "GPU rendering" preference makes
# Iced try wgpu first and fall back to tiny-skia (see
# `ui::configure_renderer_from_preferences`).
iced = { version = "0.14", default-features = false, features = ["advanced", "image-without-codecs", "svg", "tokio", "tiny-skia", "wgpu", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland"] }
zbus = "5.19"
ksni = "0.3.6"

[target.'cfg(unix)'.dependencies]
# Process memory and CPU readings for the status line on macOS, and the signal that ended a helper;
# already in the build through other crates.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Now Playing and the media keys, through the system's MediaPlayer framework. All of these but the
# last are already in the build through the audio and window crates.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSEnumerator", "NSData", "NSDictionary", "NSLocale", "NSObject", "NSString", "NSURL", "NSValue"] }
# NSOpenPanel and its parents: the Open panel a playlist cover is chosen in.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSImage", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "objc2"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The tray icon: the notification area on Windows and the menu bar on macOS. Linux keeps its own
# StatusNotifier item (`ksni`).
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
iced = { version = "0.14", features = ["advanced", "image-without-codecs", "svg", "tokio"] }

[profile.dev]
# Line tables only: full debug info for this dependency tree (V8, wgpu, OXC)
# makes target/ very large.
debug = "line-tables-only"

[profile.release]
# Optimise for binary size and memory by default; the per-package overrides
# below compile the rendering, image, audio and app code at full speed.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

# Hot rendering, image decoding and AAC decoding run at opt-level 3.

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.iced_tiny_skia]
opt-level = 3

[profile.release.package.iced_graphics]
opt-level = 3

[profile.release.package.cosmic-text]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.crabytube]
opt-level = 3
