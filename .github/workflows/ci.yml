name: Rust CI

on:
  push:
  pull_request:
  # Also started by hand from the Actions tab or `gh workflow run`.
  workflow_dispatch:

permissions:
  contents: read

# Every third-party action is pinned by commit, as in release.yml; update them deliberately and keep
# the version in the comment beside each one.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on every push: formatting, lints and tests on Linux only.
  linux-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain master of 2026-10-09 (merge of #187)
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Linux audio, windowing and D-Bus packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config \
            libvulkan-dev \
            dbus

      - run: cargo fmt --check
      # The license texts the packages ship must cover the crates of Cargo.lock.
      - name: Third-party licenses are up to date
        run: python3 scripts/third-party-licenses.py | diff -q - packaging/THIRD-PARTY-LICENSES.txt
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The MPRIS and tray integration tests need a session bus, so the tests run under a private one.
      - run: dbus-run-session -- env CRABYTUBE_TEST_MPRIS_BUS=1 CRABYTUBE_TEST_TRAY_BUS=1 cargo test --workspace --locked

  # Cross-platform checks and release build on pull requests, the default branch and by hand.
  platform-matrix:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain master of 2026-10-09 (merge of #187)
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Linux audio and windowing packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config \
            libvulkan-dev

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
