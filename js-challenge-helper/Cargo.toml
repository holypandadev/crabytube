[package]
name = "js-challenge-helper"
version = "0.2.1"
edition = "2024"

[dependencies]
ytdlp-ejs = { git = "https://github.com/ahaoboy/ytdlp-ejs", rev = "de624cbd4d8e7cf29f0dcb9b00b410991570d011", default-features = false, features = ["qjs"] }
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
helper-guard = { path = "../helper-guard" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
