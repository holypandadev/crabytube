[package]
name = "botguard-helper"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "botguard-helper"
path = "src/main.rs"

[dependencies]
rustypipe-botguard = "=0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
helper-guard = { path = "../helper-guard" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
