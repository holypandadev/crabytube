app-id: dev.holypanda.CrabyTube
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: crabytube
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  # Track notifications go to the desktop's notification service, which the portal does not always
  # reach (it may hand them to a backend the desktop does not show).
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.crabytube
  # Discord's rich presence: the native sockets (Discord takes the next one when the first is in
  # use), and the folders of the Discord and Vesktop Flatpaks. A native socket is only seen when it
  # exists as CrabyTube starts.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/app/com.discordapp.Discord
  - --filesystem=xdg-run/app/dev.vencord.Vesktop
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # The SDK's default CFLAGS end in -O2. aws-lc-sys compiles its CPU Jitter RNG at -O0 and stops
  # with an error when an optimisation flag from CFLAGS comes after it. The SDK's other hardening
  # flags are kept; C code gets the release profile's level instead, which is -Os (opt-level "z").
  cflags-override: true
  cflags: "-pipe -g -Wp,-D_FORTIFY_SOURCE=3 -Wp,-D_GLIBCXX_ASSERTIONS -fexceptions -fstack-protector-strong -grecord-gcc-switches -fasynchronous-unwind-tables -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
  env:
    CARGO_HOME: /run/build/crabytube/cargo
    # The V8 static library the v8 crate links instead of downloading it during the build.
    RUSTY_V8_ARCHIVE: /run/build/crabytube/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz
modules:
  - name: crabytube
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/crabytube /app/bin/crabytube
      - install -Dm755 target/release/botguard-helper /app/bin/botguard-helper
      - install -Dm755 target/release/js-challenge-helper /app/bin/js-challenge-helper
      - install -Dm644 packaging/linux/dev.holypanda.CrabyTube.desktop /app/share/applications/dev.holypanda.CrabyTube.desktop
      - install -Dm644 packaging/linux/flatpak/dev.holypanda.CrabyTube.metainfo.xml /app/share/metainfo/dev.holypanda.CrabyTube.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/dev.holypanda.CrabyTube/LICENSE
      - install -Dm644 packaging/THIRD-PARTY-LICENSES.txt /app/share/licenses/dev.holypanda.CrabyTube/THIRD-PARTY-LICENSES.txt
      # Flatpak exports icons of at most 512x512, so the 1024 size stays out of the app.
      - mkdir -p /app/share/icons && cp -r packaging/icons/hicolor /app/share/icons/ && rm -r /app/share/icons/hicolor/1024x1024
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - target
          - .flatpak-builder
      # Every crate in Cargo.lock, vendored, plus the two git dependencies. Regenerate it whenever
      # Cargo.lock changes; tests/flatpak_sources.rs fails while a registry crate is missing:
      #   python3 -I flatpak-cargo-generator.py <path to Cargo.lock> -o packaging/linux/flatpak/cargo-sources.json
      # Generator: cargo/flatpak-cargo-generator.py of flatpak/flatpak-builder-tools at commit
      # 74697c75b630d7330e77250fc13cb5ea688d9479, sha256 0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380.
      # Its dependencies are aiohttp and tomlkit (>=0.13.3,<1.0); PyYAML is optional.
      - cargo-sources.json
      - type: file
        url: https://github.com/denoland/rusty_v8/releases/download/v130.0.7/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz
        sha256: a6476cb94e9b0247081c465424eb793d77732b8db80848132d78cbb50f34b75d
        dest-filename: librusty_v8_release_x86_64-unknown-linux-gnu.a.gz
